[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "voyager-radio-benchmark"
version = "0.1.0"
description = "Reproducible radio-signal and exoplanet-atmosphere benchmarks"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "blimpy==2.1.4",
  "h5py>=3.10,<4",
  "matplotlib>=3.8,<3.11",
  "numpy>=1.26,<2.3",
  # blimpy 2.1.4 imports pkg_resources, removed from newer setuptools.
  "setuptools>=75,<81",
  "turbo-seti==2.3.2",
]

[project.scripts]
atmosphere-benchmark = "atmosphere_benchmark.cli:main"
gj486-benchmark = "gj486_benchmark.cli:main"
k218-repeatability = "k218_repeatability.cli:main"
synthetic-atmosphere-benchmark = "synthetic_atmosphere_benchmark.cli:main"
voyager-benchmark = "voyager_benchmark.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atmosphere_benchmark = ["data_manifest.json"]
gj486_benchmark = ["data_manifest.json"]
k218_repeatability = ["data_manifest.json"]
synthetic_atmosphere_benchmark = ["data_manifest.json"]
voyager_benchmark = ["data_manifest.json"]
